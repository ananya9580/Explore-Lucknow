<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Explore Lucknow</title>

    <link rel="stylesheet" href="register.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="left">

            <h1>Explore Lucknow</h1>

            <p>
                Create your account and start sharing
                your unforgettable travel experiences.
            </p>

        </div>

        <div class="right">

            <form id="registerForm">

                <h2>Create Account</h2>

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text"
                        id="name"
                        placeholder="Full Name"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email"
                        id="email"
                        placeholder="Email Address"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password"
                        id="password"
                        placeholder="Password"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        required>
                </div>

                <button type="submit">
                    Register
                </button>

                <p class="login-text">
                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
