<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Explore Lucknow</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="left">

            <h1>Welcome Back!</h1>

            <p>
                Login and continue exploring the beautiful
                places of Lucknow.
            </p>

        </div>

        <div class="right">

            <form id="loginForm">

                <h2>Login</h2>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                </div>

                <button type="submit">

                    Login

                </button>

                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </p>

            </form>

        </div>

    </div>

<script src="js/login.js"></script>

</body>
</html>
